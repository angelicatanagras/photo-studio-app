{% extends "layouts/admin_base.html" %}

{% block content %}
<section class="portfolio_section mt-4">
  <div class="container">
    <div class="row mb-4">
      <div class="col-12">
        <h2 class="text-charcoal">Edit User</h2>
        <p class="text-muted">Update user information</p>
      </div>
    </div>

    <div class="row">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}">
              <div class="mb-3">
                <label for="first_name" class="form-label">First Name</label>
                <input type="text" class="form-control" id="first_name" name="first_name"
                       value="{{ user.first_name }}" required>
              </div>

              <div class="mb-3">
                <label for="last_name" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="last_name" name="last_name"
                       value="{{ user.last_name }}" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       value="{{ user.email }}" required>
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="phone" name="phone"
                       value="{{ user.phone if user.phone else '' }}">
              </div>

              <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" name="role" required>
                  <option value="Customer" {% if user.role == 'Customer' %}selected{% endif %}>Customer</option>
                  <option value="Photographer" {% if user.role == 'Photographer' %}selected{% endif %}>Photographer</option>
                  <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin</option>
                </select>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
